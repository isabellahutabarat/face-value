<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Archive — Face Value</title>
  <link rel="preload" href="assets/fonts/ABCDiatype-Medium-Trial.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css?v=20">
  <script src="data/photos.js?v=20" defer></script>
  <script src="script.js?v=20" defer></script>
</head>
<body class="archive" data-page="archive">
  <header class="site-header">
    <a class="brand" href="index.html">Face Value</a>
    <span class="clock" aria-hidden="true">00:00:00</span>
    <nav class="nav" aria-label="Main">
      <a href="archive.html" aria-current="page">Archive</a>
      <a href="info.html">Info</a>
    </nav>
  </header>
  <main>
    <h1 class="visually-hidden">Archive</h1>
    <div class="layout">
      <nav class="index" aria-label="Index">
        <button class="index__label btn-text" type="button" aria-controls="index-list">Index</button>
        <ol class="index__list" id="index-list"></ol>
      </nav>
      <ol class="thumbs" id="archive"></ol>
    </div>
  </main>

  <div class="photo-page" id="photo-page" role="dialog" aria-modal="true" aria-labelledby="photo-page-title" hidden>
    <div class="photo-page__bar">
      <span id="photo-page-fraction"></span>
      <button class="btn-text" type="button" id="photo-page-exit">Exit</button>
    </div>
    <div class="photo-page__body" id="photo-page-body">
      <div class="photo-page__content" id="photo-page-content">
        <img class="photo-page__img" id="photo-page-img" alt="" width="1472" height="828">
        <div class="photo-page__text" id="photo-page-text">
          <div>
            <h2 class="photo-page__title" id="photo-page-title"><span class="photo-page__date" id="photo-page-date"></span> <span class="photo-page__time" id="photo-page-time"></span></h2>
            <p class="photo-page__caption" id="photo-page-caption"></p>
          </div>
          <div>
            <p class="photo-page__question">What are you doing right now?</p>
            <p class="photo-page__doing" id="photo-page-doing"></p>
            <dl class="photo-page__info" id="photo-page-info"></dl>
          </div>
        </div>
      </div>
    </div>
    <button class="photo-page__arrow photo-page__arrow--prev" type="button" id="photo-page-prev" aria-label="Previous photo"></button>
    <button class="photo-page__arrow photo-page__arrow--next" type="button" id="photo-page-next" aria-label="Next photo"></button>
  </div>
</body>
</html>
